<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" shape-rendering="crispEdges" role="img" aria-label="Mobil F1 pixel art Max Verstappen bolak-balik">
  <style>
    .mover { animation: mv 7s ease-in-out infinite; }
    .flipper { transform-box: fill-box; transform-origin: center; animation: fl 7s ease-in-out infinite; }
    @keyframes mv {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(330px); }
    }
    @keyframes fl {
      0%, 49.9% { transform: scaleX(1); }
      50%, 100% { transform: scaleX(-1); }
    }
  </style>

  <!-- garis trek -->
  <line x1="0" y1="132" x2="640" y2="132" stroke="#8a8fa3" stroke-width="3" stroke-dasharray="14 10" opacity="0.6"/>
  <!-- bendera kotak-kotak -->
  <rect x="606" y="52" width="4" height="80" fill="#555"/>
  <rect x="610" y="52" width="24" height="18" fill="#fff"/>
  <rect x="610" y="52" width="6" height="6" fill="#111"/><rect x="622" y="52" width="6" height="6" fill="#111"/>
  <rect x="616" y="58" width="6" height="6" fill="#111"/><rect x="628" y="58" width="6" height="6" fill="#111"/>
  <rect x="610" y="64" width="6" height="6" fill="#111"/><rect x="622" y="64" width="6" height="6" fill="#111"/>

  <g class="mover">
    <g class="flipper">
      <!-- ===== MOBIL F1 PIXEL ART (menghadap kanan), livery Red Bull ===== -->
      <!-- speed lines -->
      <rect x="0" y="72" width="20" height="4" fill="#aab" opacity="0.5"/>
      <rect x="4" y="84" width="16" height="4" fill="#aab" opacity="0.5"/>
      <rect x="0" y="96" width="14" height="4" fill="#aab" opacity="0.4"/>
      <!-- rear wing (pendek) -->
      <rect x="14" y="58" width="8" height="22" fill="#CC1E4A"/>
      <rect x="6" y="50" width="36" height="8" fill="#1E2A56"/>
      <rect x="6" y="50" width="8" height="8" fill="#CC1E4A"/>
      <rect x="34" y="50" width="8" height="8" fill="#CC1E4A"/>
      <!-- shark fin -->
      <rect x="24" y="64" width="8" height="12" fill="#CC1E4A"/>
      <rect x="32" y="56" width="8" height="20" fill="#CC1E4A"/>
      <rect x="40" y="48" width="8" height="28" fill="#CC1E4A"/>
      <!-- airbox -->
      <rect x="96" y="48" width="32" height="24" fill="#1E2A56"/>
      <!-- halo -->
      <rect x="104" y="40" width="24" height="8" fill="#14141c"/>
      <rect x="104" y="40" width="8" height="16" fill="#14141c"/>
      <rect x="120" y="40" width="8" height="16" fill="#14141c"/>
      <!-- helm driver -->
      <rect x="104" y="48" width="16" height="16" fill="#FFD700"/>
      <rect x="104" y="52" width="16" height="5" fill="#CC1E4A"/>
      <rect x="112" y="55" width="8" height="6" fill="#14141c"/>
      <!-- bodi utama -->
      <rect x="24" y="72" width="200" height="24" fill="#1E2A56"/>
      <rect x="24" y="72" width="200" height="6" fill="#27356b"/>
      <!-- sidepod merah -->
      <rect x="64" y="78" width="56" height="12" fill="#CC1E4A"/>
      <!-- hidung bertangga -->
      <rect x="224" y="72" width="24" height="16" fill="#1E2A56"/>
      <rect x="248" y="76" width="16" height="12" fill="#1E2A56"/>
      <rect x="264" y="80" width="16" height="8" fill="#1E2A56"/>
      <!-- front wing -->
      <rect x="272" y="88" width="26" height="8" fill="#CC1E4A"/>
      <rect x="272" y="88" width="26" height="3" fill="#FFD700"/>
      <!-- lantai -->
      <rect x="24" y="96" width="248" height="8" fill="#0c0c14"/>
      <!-- BAN BELAKANG (lebih besar) -->
      <rect x="36" y="92" width="8" height="36" fill="#14141c"/>
      <rect x="68" y="92" width="8" height="36" fill="#14141c"/>
      <rect x="36" y="92" width="40" height="8" fill="#14141c"/>
      <rect x="36" y="120" width="40" height="8" fill="#14141c"/>
      <rect x="52" y="96" width="8" height="28" fill="#8a8fa3"/>
      <rect x="40" y="106" width="32" height="8" fill="#8a8fa3"/>
      <rect x="50" y="104" width="12" height="12" fill="#FFD700"/>
      <!-- BAN DEPAN (lebih kecil) -->
      <rect x="212" y="100" width="8" height="28" fill="#14141c"/>
      <rect x="236" y="100" width="8" height="28" fill="#14141c"/>
      <rect x="212" y="100" width="32" height="8" fill="#14141c"/>
      <rect x="212" y="120" width="32" height="8" fill="#14141c"/>
      <rect x="224" y="104" width="8" height="20" fill="#8a8fa3"/>
      <rect x="216" y="110" width="24" height="8" fill="#8a8fa3"/>
      <rect x="222" y="108" width="12" height="12" fill="#FFD700"/>
      <!-- asap knalpot -->
      <rect x="8" y="86" width="8" height="8" fill="#cfd3e0" opacity="0.5"/>
      <rect x="0" y="80" width="10" height="10" fill="#cfd3e0" opacity="0.3"/>
    </g>
  </g>
</svg>
