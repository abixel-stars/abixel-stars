<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="Mobil F1 Max Verstappen bolak-balik">
  <style>
    .mover { animation: mv 7s ease-in-out infinite; }
    .flipper { transform-box: fill-box; transform-origin: center; animation: fl 7s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: sp 0.6s linear infinite; }
    @keyframes mv {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(430px); }
    }
    @keyframes fl {
      0%, 49.9% { transform: scaleX(1); }
      50%, 100% { transform: scaleX(-1); }
    }
    @keyframes sp {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- garis trek (diam, mobilnya yang jalan) -->
  <line x1="0" y1="126" x2="640" y2="126" stroke="#8a8fa3" stroke-width="3" stroke-dasharray="14 10" opacity="0.6"/>
  <!-- bendera kotak-kotak di ujung kanan -->
  <rect x="606" y="52" width="4" height="74" fill="#555"/>
  <g>
    <rect x="610" y="52" width="24" height="18" fill="#fff"/>
    <rect x="610" y="52" width="6" height="6" fill="#111"/><rect x="622" y="52" width="6" height="6" fill="#111"/>
    <rect x="616" y="58" width="6" height="6" fill="#111"/><rect x="628" y="58" width="6" height="6" fill="#111"/>
    <rect x="610" y="64" width="6" height="6" fill="#111"/><rect x="622" y="64" width="6" height="6" fill="#111"/>
  </g>

  <g class="mover">
    <g class="flipper">
      <!-- ===== MOBIL F1 (menghadap kanan), livery Red Bull ===== -->
      <!-- speed lines -->
      <g stroke="#aab" stroke-width="2" opacity="0.5" stroke-linecap="round">
        <line x1="2" y1="80" x2="26" y2="80"/>
        <line x1="6" y1="92" x2="24" y2="92"/>
        <line x1="2" y1="104" x2="20" y2="104"/>
      </g>
      <!-- rear wing (pendek) -->
      <rect x="12" y="62" width="7" height="22" fill="#CC1E4A"/>
      <rect x="4" y="56" width="32" height="7" rx="2" fill="#1E2A56"/>
      <rect x="4" y="56" width="32" height="2.5" fill="#CC1E4A"/>
      <!-- shark fin / engine cover -->
      <path d="M18 84 L104 58 L112 58 L40 86 Z" fill="#CC1E4A"/>
      <!-- nomor 1 -->
      <text x="52" y="76" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD700">1</text>
      <!-- bodi utama -->
      <path d="M22 100 L36 82 L96 76 L150 80 L188 90 L192 96 L192 102 L22 102 Z" fill="#1E2A56"/>
      <path d="M22 100 L36 82 L96 76 L150 80 L188 90 L192 96 L60 96 Z" fill="#27356b"/>
      <!-- sidepod merah -->
      <rect x="58" y="84" width="66" height="12" rx="6" fill="#CC1E4A"/>
      <!-- halo -->
      <path d="M92 76 A16 16 0 0 1 124 76" fill="none" stroke="#111" stroke-width="4"/>
      <line x1="108" y1="60" x2="108" y2="72" stroke="#111" stroke-width="4"/>
      <!-- helm driver (kuning) -->
      <circle cx="108" cy="70" r="9" fill="#FFD700" stroke="#111" stroke-width="2"/>
      <path d="M100 66 L116 66 L114 72 L102 72 Z" fill="#CC1E4A"/>
      <!-- hidung -->
      <path d="M150 80 L190 90 L190 98 L150 98 Z" fill="#1E2A56"/>
      <!-- front wing -->
      <rect x="186" y="96" width="16" height="6" rx="2" fill="#CC1E4A"/>
      <rect x="186" y="96" width="16" height="2.5" fill="#FFD700"/>
      <!-- ban belakang (sedikit lebih besar) -->
      <g>
        <circle cx="46" cy="104" r="22" fill="#14141c" stroke="#2c2c38" stroke-width="3"/>
        <g class="spin" stroke="#8a8fa3" stroke-width="3" stroke-linecap="round">
          <line x1="46" y1="86" x2="46" y2="122"/>
          <line x1="28" y1="104" x2="64" y2="104"/>
          <line x1="34" y1="92" x2="58" y2="116"/>
          <line x1="58" y1="92" x2="34" y2="116"/>
        </g>
        <circle cx="46" cy="104" r="4" fill="#FFD700"/>
      </g>
      <!-- ban depan (lebih kecil, tapi tidak terlalu kecil) -->
      <g>
        <circle cx="158" cy="107" r="19" fill="#14141c" stroke="#2c2c38" stroke-width="3"/>
        <g class="spin" stroke="#8a8fa3" stroke-width="3" stroke-linecap="round">
          <line x1="158" y1="92" x2="158" y2="122"/>
          <line x1="143" y1="107" x2="173" y2="107"/>
          <line x1="147" y1="96" x2="169" y2="118"/>
          <line x1="169" y1="96" x2="147" y2="118"/>
        </g>
        <circle cx="158" cy="107" r="4" fill="#FFD700"/>
      </g>
      <!-- asap knalpot -->
      <circle cx="14" cy="92" r="4" fill="#cfd3e0" opacity="0.5"/>
      <circle cx="6" cy="88" r="6" fill="#cfd3e0" opacity="0.3"/>
    </g>
  </g>
</svg>
